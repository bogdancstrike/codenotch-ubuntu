<text x="472" y="130" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#EDF1F5">codenotch-worker · Python</text>
<text x="472" y="150" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="12.5" fill="#7E8A98">Short-lived; one JSON snapshot per run</text>
<rect x="468" y="156" width="264" height="38" rx="10" fill="#0D1116"/>
<text x="480" y="172" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="700" fill="#DDE3EA">worker.py</text>
<text x="480" y="188" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="11" fill="#7E8A98">Settings, locks, snapshot assembly</text>
<rect x="468" y="200" width="264" height="38" rx="10" fill="#0D1116"/>
<text x="480" y="216" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="700" fill="#DDE3EA">providers.py</text>
<text x="480" y="232" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="11" fill="#7E8A98">Seven read-only usage adapters</text>
<rect x="468" y="244" width="264" height="38" rx="10" fill="#0D1116"/>
<text x="480" y="260" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="700" fill="#DDE3EA">activity.py</text>
<text x="480" y="276" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="11" fill="#7E8A98">Live sessions from local state</text>
<rect x="468" y="288" width="264" height="38" rx="10" fill="#0D1116"/>
<text x="480" y="304" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="700" fill="#DDE3EA">widgets.py</text>
<text x="480" y="320" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="11" fill="#7E8A98">Weather, battery, /proc load</text>
<rect x="468" y="332" width="264" height="38" rx="10" fill="#0D1116"/>
<text x="480" y="348" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="700" fill="#DDE3EA">model.py</text>
<text x="480" y="364" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="11" fill="#7E8A98">Strict parsers; no invented 0%</text>
<text x="472" y="404" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#6E7A88">settings.lock  short, never held</text>
<text x="472" y="420" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#6E7A88">               across a request</text>
<text x="472" y="436" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#6E7A88">poll.lock      non-blocking; a busy</text>
<text x="472" y="452" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#6E7A88">               cycle answers from cache</text>
