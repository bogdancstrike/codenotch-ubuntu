<text x="60" y="466" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="12.5" fill="#7E8A98">gnome-extensions prefs</text>
<rect x="56" y="472" width="264" height="38" rx="10" fill="#0D1116"/>
<text x="68" y="488" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="700" fill="#DDE3EA">prefs.js</text>
