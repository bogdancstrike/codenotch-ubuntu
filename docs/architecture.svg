<text x="68" y="216" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="700" fill="#DDE3EA">render.js</text>
<text x="68" y="232" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="11" fill="#7E8A98">Cairo geometry, rings, widgets, cards</text>
<rect x="56" y="244" width="264" height="38" rx="10" fill="#0D1116"/>
<text x="68" y="260" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="12.5" font-weight="700" fill="#DDE3EA">stylesheet.css</text>
<text x="68" y="276" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="11" fill="#7E8A98">Popup menu palette</text>
<text x="60" y="316" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#6E7A88">Pango text · 60 fps springs</text>
<text x="60" y="332" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#6E7A88">reactive only while fully open</text>
