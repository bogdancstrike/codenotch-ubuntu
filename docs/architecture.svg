<rect x="40" y="96" width="296" height="4" rx="2" fill="#5AC8FA"/>
<text x="60" y="130" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#EDF1F5">GNOME Shell · UI thread</text>
<text x="60" y="150" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="12.5" fill="#7E8A98">Draws; never blocks on I/O</text>
