  <rect width="1200" height="770" rx="24" fill="#0E1218"/>
  <text x="40" y="50" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#F2F5F8">Codenotch architecture</text>
  <text x="40" y="76" font-family="Ubuntu, Cantarell, DejaVu Sans, sans-serif" font-size="14" fill="#7E8A98">The shell draws. A short-lived Python worker does every read, every request, and every write.</text>
